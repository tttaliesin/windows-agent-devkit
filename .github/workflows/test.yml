name: Windows diagnostics

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test diagnostics
        run: node --test
      - name: Check plugin source and documents
        run: node scripts/check-package.mjs
